<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA Franchise History</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.78rem;
      color: #666;
      margin-bottom: 28px;
    }

    .controls {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 24px;
    }

    .team-selector {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .team-selector label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
    }

    select {
      background: #1a1a1a;
      color: #e8e8e8;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.88rem;
      cursor: pointer;
      appearance: none;
      width: 220px;
    }

    select:focus { outline: none; border-color: #555; }

    #chart-container {
      width: 100%;
      max-width: 820px;
      background: #1a1a1a;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #2a2a2a;
    }

    #chart svg { display: block; width: 100%; }

    .legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem;
      color: #bbb;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    .tooltip {
      position: fixed;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.78rem;
      color: #ddd;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      z-index: 100;
      line-height: 1.5;
    }

    .tooltip strong { color: #fff; }

    #loading {
      color: #555;
      font-size: 0.88rem;
      margin: 40px 0;
    }

    .data-source {
      margin-top: 20px;
      font-size: 0.7rem;
      color: #444;
    }

    .data-source a { color: #556; text-decoration: none; }
    .data-source a:hover { color: #888; }
  </style>
</head>
<body>
  <h1>NBA Franchise History</h1>
  <p class="subtitle">cumulative win–loss differential, from founding through 2025–26</p>

  <div class="controls">
    <div class="team-selector">
      <label>Team 1</label>
      <select id="team1"></select>
    </div>
    <div class="team-selector">
      <label>Team 2</label>
      <select id="team2"></select>
    </div>
  </div>

  <div id="chart-container">
    <div id="loading">loading data…</div>
    <div id="chart"></div>
    <div class="legend" id="legend"></div>
  </div>

  <p class="data-source">
    data: <a href="https://www.basketball-reference.com" target="_blank">Basketball Reference</a> ·
    scraped live via <code>scraper.py</code>
  </p>

  <div class="tooltip" id="tooltip"></div>

  <script src="app.js"></script>
</body>
</html>
